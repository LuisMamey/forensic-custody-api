apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forensic-custody-api
  namespace: argocd
  labels:
    app.kubernetes.io/name: forensic-custody-api
    app.kubernetes.io/part-of: forensic-custody-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/LuisMamey/forensic-custody-api.git
    targetRevision: main
    path: k8s/apps/forensic-custody-api
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
        
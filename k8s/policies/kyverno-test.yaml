apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pod-security-test
policies:
  - disallow-root-and-privileged.yaml
resources:
  - resources/valid-forensic-pod.yaml
  - resources/invalid-root-pod.yaml
results:
  - policy: disallow-root-and-privileged
    rule: require-non-root-and-readonly
    resource: valid-forensic-api-pod
    kind: Pod
    result: pass
  - policy: disallow-root-and-privileged
    rule: require-non-root-and-readonly
    resource: invalid-root-pod
    kind: Pod
    result: fail

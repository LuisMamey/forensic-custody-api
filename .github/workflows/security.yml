name: Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Run Gitleaks
        run: gitleaks detect --source . -v

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    container:
      image: semgrep/semgrep:1.175.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        run: semgrep scan --config=p/security-audit --sarif --output=semgrep.sarif || true

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: semgrep.sarif

  govulncheck:
    name: SCA (Govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"

      - name: Install Govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Run Govulncheck
        run: govulncheck ./...

  fuzz:
    name: Fuzz Testing (Go Native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"

      - name: Fuzz JWT Auth Parser
        run: go test -v -fuzz=FuzzVerifyToken -fuzztime=15s ./internal/auth/

      - name: Fuzz Chained Ledger Verifier
        run: go test -v -fuzz=FuzzVerifyLedgerChain -fuzztime=15s ./internal/crypto/

  trivy-image:
    name: Container Security (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t forensic-custody-api:ci .

      - name: Install Trivy
        run: |
          curl -sSL -o trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          tar zxvf trivy.tar.gz trivy
          sudo mv trivy /usr/local/bin/

      - name: Run Trivy scan
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 forensic-custody-api:ci

  checkov:
    name: IaC Security (Checkov)
    runs-on: ubuntu-latest
    container:
      image: bridgecrew/checkov:3.3.16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Checkov
        run: checkov -d terraform/

  conftest:
    name: Policy as Code (Conftest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Conftest
        run: |
          curl -sSL -o conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.70.1/conftest_0.70.1_Linux_x86_64.tar.gz
          tar zxvf conftest.tar.gz conftest
          sudo mv conftest /usr/local/bin/

      - name: Run Conftest policies
        run: conftest test --parser hcl2 --policy terraform/policy terraform/*.tf

  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t forensic-custody-api:ci .

      - name: Run API container
        run: docker run -d -p 8080:8080 --name forensic-api forensic-custody-api:ci

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:8080/health && break
            sleep 2
          done

      - name: Run ZAP API scan
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          target: "http://localhost:8080/openapi.yaml"
          format: openapi
          cmd_options: "-a"
          
  kyverno:
    name: Admission Policies (Kyverno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Kyverno Tests
        run: |
          docker run --rm -v "${{ github.workspace }}/k8s/policies:/workspace" -w /workspace ghcr.io/kyverno/kyverno-cli:v1.13.0@sha256:ff159bc74c30e0b878e15bda9df7b78a42c7eeabfae62a141d6ccf298801c28c test .

  falco:
    name: Runtime Security Rules (Falco)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Falco Rules Syntax
        run: |
          docker run --rm --entrypoint falco \
            -v "${{ github.workspace }}/k8s/falco:/custom-rules" \
            falcosecurity/falco:0.38.2@sha256:cdb6b2e6c8af971d366b2938466d2f247acdb7fd54470b7ea2a8dac21711e4b2 \
            -V /custom-rules/forensic-api-rules.yaml

  load-test:
    name: Load & Resilience Testing (k6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"

      - name: Build and Run API
        run: |
          go build -o api ./cmd/api
          ./api &
          for i in $(seq 1 10); do
            curl -sf http://localhost:8080/health && break
            sleep 1
          done

      - name: Run k6 Load & SLO Validation Test
        run: |
          # Generate ephemeral test token for the k6 run
          TOKEN=$(python3 -c '
          import hmac, hashlib, base64, json, time
          secret = b"forensic-custody-enterprise-secret-key-32b"
          header = base64.urlsafe_b64encode(b"{\"alg\":\"HS256\",\"typ\":\"JWT\"}").rstrip(b"=")
          payload_data = json.dumps({"sub":"investigator-k6","role":"INVESTIGATOR","exp":int(time.time())+3600}, separators=(",",":")).encode()
          payload = base64.urlsafe_b64encode(payload_data).rstrip(b"=")
          signing_input = header + b"." + payload
          sig = base64.urlsafe_b64encode(hmac.new(secret, signing_input, hashlib.sha256).digest()).rstrip(b"=")
          print((signing_input + b"." + sig).decode())
          ')

          docker run --rm --network host \
            -e AUTH_TOKEN="${TOKEN}" \
            -v "${{ github.workspace }}/tests/load:/tests" \
            grafana/k6:0.54.0@sha256:1f40432b1cbe7234e977f96c362c9bc550a2d2b583d014dd8669fe40d3e9e755 \
            run /tests/k6-slo-test.js

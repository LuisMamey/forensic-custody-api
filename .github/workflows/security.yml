name: Security Gate

on:
  push:
  pull_request:

jobs:
  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Run Gitleaks
        run: gitleaks detect --source . -v

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.175.0
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep scan --config=p/security-audit --error

  govulncheck:
    name: SCA (Govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      - name: Install Govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Run Govulncheck
        run: govulncheck ./...

  trivy-image:
    name: Container Security (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t forensic-custody-api:ci .

      - name: Install Trivy
        run: |
          curl -sSL -o trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          tar zxvf trivy.tar.gz trivy
          sudo mv trivy /usr/local/bin/

      - name: Run Trivy
        run: trivy image --exit-code 1 --severity CRITICAL,HIGH forensic-custody-api:ci

  checkov:
    name: IaC Security (Checkov)
    runs-on: ubuntu-latest
    container:
      image: bridgecrew/checkov:3.3.16
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        run: checkov -d terraform/
        
name: CSPM AWS Live Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' 

permissions:
  id-token: write
  contents: read

jobs:
  prowler-audit:
    name: Run Prowler CSPM (AWS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS Credentials (OIDC Keyless)
        uses: aws-actions/configure-aws-credentials@ececac1a45f371a57522ec0709c2a8c407ddb543 # v4.1.0
        with:
          role-to-assume: arn:aws:iam::737710548831:role/GitHubActions-ProwlerAudit-Role
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Prowler
        run: pip install prowler

      - name: Run Prowler Audit
        run: |
          mkdir -p output
          prowler aws \
            --services iam s3 \
            --output-directory output \
            --output-filename prowler-report || true

      - name: Upload Audit Reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prowler-cspm-report
          path: output/
          retention-days: 14

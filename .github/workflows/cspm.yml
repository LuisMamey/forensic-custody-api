name: CSPM Live Audit (Prowler)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  prowler:
    name: AWS Posture & Drift Audit (Prowler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Prowler against AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "us-east-1"
        run: |
          mkdir -p output && chmod 777 output
          docker run --rm --user 0 \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_DEFAULT_REGION \
            -v ${{ github.workspace }}/output:/home/prowler/output:rw \
            toniblyx/prowler:latest aws --services s3 iam -F prowler-report

      - name: Archive Prowler Security Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prowler-cspm-report
          path: output/

name: CSPM AWS Live Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' 

permissions:
  id-token: write
  contents: read

jobs:
  prowler-audit:
    name: Run Prowler CSPM (AWS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC Keyless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::737710548831:role/GitHubActions-ProwlerAudit-Role
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Prowler
        run: pip install prowler

      - name: Run Prowler Audit
        run: |
          mkdir -p output
          prowler aws \
            --services iam s3 \
            --output-directory output \
            --output-filename prowler-report || true

      - name: Upload Audit Reports
        uses: actions/upload-artifact@v4
        with:
          name: prowler-cspm-report
          path: output/
          retention-days: 14

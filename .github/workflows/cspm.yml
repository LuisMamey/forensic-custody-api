name: CSPM Live Audit (Prowler)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  prowler:
    name: AWS Posture & Drift Audit (Prowler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Prowler against AWS
        uses: prowler-cloud/prowler@v5
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "us-east-1"
        with:
          provider: aws
          services: s3 iam
          
name: CSPM AWS Live Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' 

permissions:
  id-token: write
  contents: read

jobs:
  prowler-audit:
    name: Run Prowler CSPM (AWS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS Credentials (OIDC Keyless)
        uses: aws-actions/configure-aws-credentials@ececac1a45f371a57522ec0709c2a8c407ddb543 # v4.1.0
        with:
          role-to-assume: arn:aws:iam::737710548831:role/GitHubActions-ProwlerAudit-Role
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install Prowler
        run: pip install prowler

      - name: Run Prowler Audit
        run: |
          mkdir -p output
          prowler aws \
            --services iam s3 \
            --output-directory output \
            --output-filename prowler-report || true

      - name: Upload Audit Reports
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: prowler-cspm-report
          path: output/
          retention-days: 14
